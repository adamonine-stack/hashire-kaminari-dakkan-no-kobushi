name: PR181 Lazy Resource Diagnostic

on:
  push:
    branches:
      - agent/battle-resource-residency-step1-20261004
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7"
  GODOT_STATUS: "stable"
  GODOT_PROJECT_DIR: "godot"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip
          GODOT_TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          GODOT_FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          curl --fail --location --retry 3 --output godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_FILE}"
          mkdir -p "$HOME/.local/bin"
          unzip -q godot.zip -d "$HOME/.local/bin"
          GODOT_BINARY="$HOME/.local/bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          chmod +x "$GODOT_BINARY"
          ln -sf "$GODOT_BINARY" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch Japanese UI font
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_PROJECT_DIR/assets/fonts"
          curl --fail --location --retry 3 --output "$GODOT_PROJECT_DIR/assets/fonts/NotoSansJP-Regular.otf" "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/SubsetOTF/JP/NotoSansJP-Regular.otf"

      - name: Import project resources
        run: godot --headless --path "$GODOT_PROJECT_DIR" --editor --quit

      - name: Diagnose remaining reversal and pose checks
        shell: bash
        run: |
          set +e
          overall=0
          index=15
          tests=(
            rei_reversal_presentation_check
            teki_reversal_presentation_check
            teki_damage_presentation_check
            teki_received_akky_check
            teki_received_gou_check
            teki_received_seiya_check
            combat_pose_flow_check
          )
          for test_name in "${tests[@]}"; do
            log="/tmp/${index}-${test_name}.log"
            timeout 120s godot --headless --fixed-fps 60 --path "$GODOT_PROJECT_DIR" --script "res://tests/${test_name}.gd" >"$log" 2>&1
            rc=$?
            if [ "$rc" -eq 0 ] && grep -Fq 'failures=[]' "$log"; then
              echo "RESULT ${index} ${test_name}: PASS"
            else
              echo "RESULT ${index} ${test_name}: FAIL rc=${rc}"
              grep -E 'failures=|ERROR|SCRIPT ERROR|expected|actual|FAIL|fail' "$log" | tail -n 30 || true
              overall=1
            fi
            index=$((index + 1))
          done
          exit "$overall"

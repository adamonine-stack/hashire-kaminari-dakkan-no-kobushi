name: PR181 Lazy Resource Diagnostic

on:
  push:
    branches:
      - agent/battle-resource-residency-step1-20261004
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7"
  GODOT_STATUS: "stable"
  GODOT_PROJECT_DIR: "godot"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip
          GODOT_TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          GODOT_FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          curl --fail --location --retry 3 --output godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_FILE}"
          mkdir -p "$HOME/.local/bin"
          unzip -q godot.zip -d "$HOME/.local/bin"
          GODOT_BINARY="$HOME/.local/bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          chmod +x "$GODOT_BINARY"
          ln -sf "$GODOT_BINARY" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch Japanese UI font
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_PROJECT_DIR/assets/fonts"
          curl --fail --location --retry 3 --output "$GODOT_PROJECT_DIR/assets/fonts/NotoSansJP-Regular.otf" "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/SubsetOTF/JP/NotoSansJP-Regular.otf"

      - name: Import project resources
        run: godot --headless --path "$GODOT_PROJECT_DIR" --editor --quit

      - name: 01 special_reversal_check
        run: timeout 120s godot --headless --fixed-fps 60 --path "$GODOT_PROJECT_DIR" --script res://tests/special_reversal_check.gd 2>&1 | tee /tmp/01.log; grep -Fq 'failures=[]' /tmp/01.log
      - name: 02 special_ai_situation_check
        run: timeout 120s godot --headless --fixed-fps 60 --path "$GODOT_PROJECT_DIR" --script res://tests/special_ai_situation_check.gd 2>&1 | tee /tmp/02.log; grep -Fq 'failures=[]' /tmp/02.log
      - name: 03 special_grapple_guard_check

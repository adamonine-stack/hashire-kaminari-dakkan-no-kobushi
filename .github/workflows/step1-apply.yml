name: Apply STEP1 lazy resource patch

on:
  push:
    branches:
      - agent/battle-resource-residency-step1-20261004
    paths:
      - ".github/workflows/step1-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/battle-resource-residency-step1-20261004
          fetch-depth: 0

      - name: Apply migration
        run: python3 tools/apply_step1_lazy_resources.py

      - name: Verify expected lazy-resource markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const ENEMY_MANIFESTS: Array[Dictionary]' godot/scripts/battle/battle_manager.gd
          grep -Fq 'var _current_enemy_definition: Resource = null' godot/scripts/battle/battle_manager.gd
          grep -Fq 'func _ensure_current_enemy_definition() -> Resource:' godot/scripts/battle/battle_manager.gd
          grep -Fq 'const STAGE_DEFINITION_PATHS: Array[String]' godot/scripts/battle/battle_manager.gd
          ! grep -Fq 'const ENEMY_DEFINITIONS: Array[Resource]' godot/scripts/battle/battle_manager.gd
          ! grep -Fq 'const STAGE_DEFINITIONS: Array[Resource]' godot/scripts/battle/battle_manager.gd

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add godot/scripts/battle/battle_manager.gd godot/scripts/battle/stage1_battle_manager.gd
          git commit -m "Lazy-load active enemy and stage resources"
          git push origin HEAD:agent/battle-resource-residency-step1-20261004

name: Deploy Godot Web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "godot/**"
      - ".github/workflows/deploy-godot-web.yml"
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/deploy-godot-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"
  GODOT_STATUS: "stable"
  GODOT_PROJECT_DIR: "godot"
  WEB_BUILD_DIR: "build/web"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required packages
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Download Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          GODOT_FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          TEMPLATE_FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          BASE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}"

          curl --fail --location --retry 3 --output godot.zip "${BASE_URL}/${GODOT_FILE}"
          curl --fail --location --retry 3 --output export_templates.tpz "${BASE_URL}/${TEMPLATE_FILE}"

          mkdir -p "$HOME/.local/bin"
          unzip -q godot.zip -d "$HOME/.local/bin"
          GODOT_BINARY="$HOME/.local/bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          chmod +x "$GODOT_BINARY"
          ln -sf "$GODOT_BINARY" "$HOME/.local/bin/godot"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p template_extract "$TEMPLATE_DIR"
          unzip -q export_templates.tpz -d template_extract
          cp -a template_extract/templates/. "$TEMPLATE_DIR/"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Godot installation
        run: godot --version

      - name: Fetch Japanese UI font
        shell: bash
        run: |
          set -euo pipefail
          FONT_DIR="$GODOT_PROJECT_DIR/assets/fonts"
          mkdir -p "$FONT_DIR"
          curl --fail --location --retry 3 \
            --output "$FONT_DIR/NotoSansJP-Regular.otf" \
            "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/SubsetOTF/JP/NotoSansJP-Regular.otf"
          curl --fail --location --retry 3 \
            --output "$FONT_DIR/OFL.txt" \
            "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/LICENSE"
          test -s "$FONT_DIR/NotoSansJP-Regular.otf"
          test -s "$FONT_DIR/OFL.txt"

      - name: Import project resources
        run: godot --headless --path "$GODOT_PROJECT_DIR" --editor --quit

      - name: Verify Web battle QA scene
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_crusher_web_qa.py
          timeout 120s godot --headless --fixed-fps 60 --path "$GODOT_PROJECT_DIR" res://tests/crusher_web_qa.tscn 2>&1 | tee /tmp/crusher-web-qa.log
          grep -Fq 'SPECIAL_LAUNCH_REACTION_CHECK failures=[]' /tmp/crusher-web-qa.log
            if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/crusher-web-qa.log; then exit 1; fi
            python3 tools/build_leon_web_qa.py
            timeout 120s godot --headless --fixed-fps 60 --path "$GODOT_PROJECT_DIR" res://tests/leon_web_qa.tscn 2>&1 | tee /tmp/leon-web-qa.log
            grep -q 'LEON_MOTION_INTEGRITY_RESULT.*failures=\[\]' /tmp/leon-web-qa.log
            if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/leon-web-qa.log; then exit 1; fi
            python3 tools/build_masato_web_qa.py
            timeout 120s godot --headless --fixed-fps 60 --path "$GODOT_PROJECT_DIR" res://tests/masato_web_qa.tscn 2>&1 | tee /tmp/masato-web-qa.log
            grep -q 'MASATO_MOTION_INTEGRITY_RESULT.*failures=\[\]' /tmp/masato-web-qa.log
            if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/masato-web-qa.log; then exit 1; fi

            python3 tools/build_rio_web_qa.py
            timeout 120s godot --headless --fixed-fps 60 --path "$GODOT_PROJECT_DIR" res://tests/rio_web_qa.tscn 2>&1 | tee /tmp/rio-web-qa.log
            grep -q 'RIO_MOTION_INTEGRITY_RESULT.*failures=\[\]' /tmp/rio-web-qa.log
            if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/rio-web-qa.log; then exit 1; fi
            python3 tools/build_grapple_web_qa.py
            timeout 120s godot --headless --fixed-fps 60 --path "$GODOT_PROJECT_DIR" res://tests/grapple_web_qa.tscn 2>&1 | tee /tmp/grapple-web-qa.log
            grep -q 'GRAPPLE_MOTION_INTEGRITY_RESULT.*failures=\[\]' /tmp/grapple-web-qa.log
            if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/grapple-web-qa.log; then exit 1; fi

            python3 tools/build_cross_web_qa.py
            timeout 120s godot --headless --fixed-fps 60 --path "$GODOT_PROJECT_DIR" res://tests/cross_web_qa.tscn 2>&1 | tee /tmp/cross-web-qa.log
            grep -q 'CROSS_MOTION_INTEGRITY_RESULT.*failures=\[\]' /tmp/cross-web-qa.log
            if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/cross-web-qa.log; then exit 1; fi
            python3 tools/build_muei_web_qa.py
            timeout 120s godot --headless --fixed-fps 60 --path "$GODOT_PROJECT_DIR" res://tests/muei_web_qa.tscn 2>&1 | tee /tmp/muei-web-qa.log
            grep -q 'CROSS_MUEI_RESULT.*failures=\[\]' /tmp/muei-web-qa.log
            if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/muei-web-qa.log; then exit 1; fi

            python3 tools/build_shadow_web_qa.py
            timeout 120s godot --headless --fixed-fps 60 --path "$GODOT_PROJECT_DIR" res://tests/shadow_web_qa.tscn 2>&1 | tee /tmp/shadow-web-qa.log
            grep -q 'SHADOW_MOTION_INTEGRITY_RESULT.*failures=\[\]' /tmp/shadow-web-qa.log
            if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/shadow-web-qa.log; then exit 1; fi
            timeout 120s godot --headless --fixed-fps 60 --path "$GODOT_PROJECT_DIR" res://tests/counter_web_qa.tscn 2>&1 | tee /tmp/counter-web-qa.log
            grep -q 'SPECIAL_LAUNCH_REACTION_CHECK.*failures=\[\]' /tmp/counter-web-qa.log
            if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/counter-web-qa.log; then exit 1; fi

      - name: Verify Japanese UI font
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/japanese_font_smoke.gd 2>&1 | tee /tmp/japanese-font.log || true
          grep -q "JAPANESE_FONT_OK" /tmp/japanese-font.log

      - name: Verify audio runtime
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/dev_audio_smoke.gd 2>&1 | tee /tmp/dev-audio.log || true
          grep -q "DEV_AUDIO_OK" /tmp/dev-audio.log

      - name: Verify AKKY and Crusher one-on-one combat
        shell: bash
        run: |
          set -euo pipefail
          for spec in "duel_mobile_input_check:DUEL_MOBILE_INPUT_CHECK" "duel_mobile_repeat_check:DUEL_MOBILE_REPEAT_CHECK" "combat_flow_check:COMBAT_FLOW_CHECK" "directional_attacks_check:DIRECTIONAL_ATTACKS_CHECK" "directional_throws_check:DIRECTIONAL_THROWS_CHECK" "air_combo_check:AIR_COMBO_CHECK" "air_guard_check:AIR_GUARD_CHECK" "dedicated_special_guard_check:DEDICATED_SPECIAL_GUARD_CHECK" "receiver_routing_check:RECEIVER_ROUTING_CHECK" "wall_bounce_check:WALL_BOUNCE_CHECK"; do
            test="${spec%%:*}"
            marker="${spec#*:}"
            timeout 180s godot --headless --path "$GODOT_PROJECT_DIR" --script "res://tests/$test.gd" 2>&1 | tee "/tmp/pair-$test.log"
            grep -Fq "$marker failures=[]" "/tmp/pair-$test.log"
            if grep -E 'SCRIPT ERROR:|^ERROR:' "/tmp/pair-$test.log"; then exit 1; fi
          done

      - name: Verify Stage 1 motion scale and repair contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage1-motion-qa
          for test in stage1_body_dimensions_check akky_hit_dimensions_check akky_air_dimensions_check akky_back_throw_dimensions_check akky_special_guard_dimensions_check akky_ground_bounce_dimensions_check akky_wall_dimensions_check back_throw_physics_check akky_ground_bounce_physics_check akky_wall_physics_check akky_continuous_gameplay_check stage1_regression; do
            timeout 240s godot --headless --fixed-fps 60 --path "$GODOT_PROJECT_DIR" --script "res://tests/$test.gd" 2>&1 | tee "/tmp/stage1-motion-qa/$test.log"
            grep -Fq 'failures=[]' "/tmp/stage1-motion-qa/$test.log"
            if grep -E 'SCRIPT ERROR:|^ERROR:' "/tmp/stage1-motion-qa/$test.log"; then exit 1; fi
          done
          for hero in akky gou seiya; do
            args=()
            if [ "$hero" != akky ]; then args=(-- "--$hero"); fi
            timeout 240s godot --headless --fixed-fps 60 --path "$GODOT_PROJECT_DIR" --script res://tests/stage1_release_playthrough.gd "${args[@]}" 2>&1 | tee "/tmp/stage1-motion-qa/playthrough-$hero.log"
            grep -Fq 'cleared=true' "/tmp/stage1-motion-qa/playthrough-$hero.log"
            if grep -E 'SCRIPT ERROR:|^ERROR:' "/tmp/stage1-motion-qa/playthrough-$hero.log"; then exit 1; fi
          done

      - name: Upload Stage 1 motion QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-motion-qa
          path: |
            /tmp/stage1-motion-qa/*.log
            audit_evidence/body_dimensions/stage1_release_gate/inventory.json
            audit_evidence/body_dimensions/continuous_gameplay/headless/inventory.json
          if-no-files-found: warn

      - name: Verify Stage 1 battle slice
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/dev053_stage1_smoke.gd 2>&1 | tee /tmp/dev053-stage1.log || true
          grep -q "DEV053_STAGE1_OK" /tmp/dev053-stage1.log

      - name: Verify title to opening to fighter selection flow
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/opening_flow_smoke.gd 2>&1 | tee /tmp/opening-flow.log
          grep -q "OPENING_FLOW_OK" /tmp/opening-flow.log

      - name: Verify enemy air attacks
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/dev056_enemy_air_attack_smoke.gd 2>&1 | tee /tmp/dev056-air.log || true
          grep -q "DEV056_ENEMY_AIR_ATTACK_OK" /tmp/dev056-air.log

      - name: Verify Stage 8 endings and true Seiya battle
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/stage8_ending_check.gd 2>&1 | tee /tmp/stage8-ending.log
          grep -Fq 'STAGE8_ENDING_CHECK failures=[]' /tmp/stage8-ending.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/stage8-ending.log; then exit 1; fi
          timeout 60s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/true_seiya_combat_check.gd 2>&1 | tee /tmp/true-seiya-combat.log
          grep -Fq 'TRUE_SEIYA_COMBAT_CHECK failures=[]' /tmp/true-seiya-combat.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/true-seiya-combat.log; then exit 1; fi

      - name: Verify cinematic true ending and save compatibility
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/true_ending_check.gd 2>&1 | tee /tmp/true-ending.log
          grep -Fq 'TRUE_ENDING_CHECK failures=[]' /tmp/true-ending.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/true-ending.log; then exit 1; fi

      - name: Verify dark Seiya proportions and aura combat
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/dark_seiya_combat_check.gd 2>&1 | tee /tmp/dark-seiya.log
          grep -Fq 'DARK_SEIYA_COMBAT_CHECK failures=[]' /tmp/dark-seiya.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/dark-seiya.log; then exit 1; fi

      - name: Verify Stage 9 two-hit combat and complete motion integrity
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s godot --headless --fixed-fps 60 --path "$GODOT_PROJECT_DIR" res://tests/stage9_two_hit_qa.tscn 2>&1 | tee /tmp/stage9-two-hit.log
          grep -Fq 'STAGE9_TWO_HIT_RESULT' /tmp/stage9-two-hit.log
          grep -Fq 'failures=[]' /tmp/stage9-two-hit.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/stage9-two-hit.log; then exit 1; fi

      - name: Verify ST_action frame regions, stage transitions and gauge states
        shell: bash
        run: |
          set -euo pipefail
          for test in stage5_6_motion_atlas stage5_shadow_boxer_regression stage7_8_motion_atlas st_action_fix_regression; do
            timeout 90s godot --headless --path "$GODOT_PROJECT_DIR" --script "res://tests/$test.gd" 2>&1 | tee "/tmp/$test.log"
            if grep -E 'SCRIPT ERROR:|^ERROR:' "/tmp/$test.log"; then exit 1; fi
          done

      - name: Verify touch drift, rapid taps and recovery
        shell: bash
        run: |
          set -euo pipefail
          for hero in akky gou seiya; do
            timeout 120s godot --headless --fixed-fps 60 --path "$GODOT_PROJECT_DIR" --script res://tests/control_response_check.gd -- "--$hero" 2>&1 | tee "/tmp/control-response-$hero.log"
            grep -Fq 'failures=[]' "/tmp/control-response-$hero.log"
            if grep -E 'SCRIPT ERROR:|^ERROR:' "/tmp/control-response-$hero.log"; then exit 1; fi
          done

      - name: Verify enemy pressure profiles
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/dev061_enemy_pressure_smoke.gd 2>&1 | tee /tmp/dev061-enemy-pressure.log || true
          grep -q "DEV061_ENEMY_PRESSURE_OK" /tmp/dev061-enemy-pressure.log

      - name: Verify guard counterplay
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/dev062_guard_counterplay_smoke.gd 2>&1 | tee /tmp/dev062-guard-counterplay.log || true
          grep -q "DEV062_GUARD_COUNTERPLAY_OK" /tmp/dev062-guard-counterplay.log

      - name: Verify double-tap dash and backstep
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/dev065_double_tap_mobility_smoke.gd 2>&1 | tee /tmp/dev065-double-tap.log
          grep -q "DEV065_DOUBLE_TAP_MOBILITY_OK failures=\[\]" /tmp/dev065-double-tap.log

      - name: Verify character backstep traits and enemy AI
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path "$GODOT_PROJECT_DIR" --fixed-fps 60 --script res://tests/dev066_character_backstep_ai_smoke.gd 2>&1 | tee /tmp/dev066-backstep-ai.log
          grep -q "DEV066_CHARACTER_BACKSTEP_AI_OK failures=\[\]" /tmp/dev066-backstep-ai.log

      - name: Verify Stage 2 campaign and Rei motion
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/stage2_regression.gd 2>&1 | tee /tmp/stage2-regression.log || true
          grep -q "STAGE2_REGRESSION failures=\[\]" /tmp/stage2-regression.log

      - name: Verify Stage 2 design and throw pairs
        shell: bash
        run: |
          set -euo pipefail
          for test in stage2_design_contract_check stage2_throw_pair_check rei_received_akky_check rei_received_gou_check rei_received_seiya_check; do
            timeout 120s godot --headless --fixed-fps 60 --path "$GODOT_PROJECT_DIR" --script "res://tests/$test.gd" 2>&1 | tee "/tmp/$test.log"
            grep -Fq 'failures=[]' "/tmp/$test.log"
            if grep -E 'SCRIPT ERROR:|^ERROR:' "/tmp/$test.log"; then exit 1; fi
          done

      - name: Verify reversal specials and enemy launch reactions
        shell: bash
        run: |
          set -euo pipefail
          for test in special_reversal_check special_ai_situation_check special_grapple_guard_check cross_motion_integrity_check cross_stage4_reversal_check cross_stage4_damage_check cross_received_akky_check cross_received_gou_check cross_received_seiya_check akky_reversal_motion_check akky_wall_launch_check gou_reversal_presentation_check seiya_somersault_check crusher_reversal_presentation_check rei_reversal_presentation_check teki_reversal_presentation_check teki_damage_presentation_check teki_received_akky_check teki_received_gou_check teki_received_seiya_check combat_pose_flow_check; do
            timeout 120s godot --headless --fixed-fps 60 --path "$GODOT_PROJECT_DIR" --script "res://tests/$test.gd" 2>&1 | tee "/tmp/$test.log"
            grep -Fq 'failures=[]' "/tmp/$test.log"
            if grep -E 'SCRIPT ERROR:|^ERROR:' "/tmp/$test.log"; then exit 1; fi
          done

      - name: Verify special gauge balance
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/dev063_special_gauge_balance_smoke.gd 2>&1 | tee /tmp/dev063-special-gauge.log || true
          grep -q "DEV063_SPECIAL_GAUGE_BALANCE_OK" /tmp/dev063-special-gauge.log

      - name: Verify archetype combat balance
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/dev064_archetype_balance_smoke.gd 2>&1 | tee /tmp/dev064-archetype-balance.log || true
          grep -q "DEV064_ARCHETYPE_BALANCE_OK" /tmp/dev064-archetype-balance.log

      - name: Verify Stage 3 campaign and Teki grappling
        shell: bash
        run: |
          set -o pipefail
          timeout 150s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/stage3_regression.gd 2>&1 | tee /tmp/stage3-regression.log
          grep -q "STAGE3_REGRESSION failures=\[\]" /tmp/stage3-regression.log

      - name: Verify Stage 4 and ally grapple reactions
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path "$GODOT_PROJECT_DIR" --fixed-fps 60 --script res://tests/stage4_regression.gd 2>&1 | tee /tmp/stage4.log
          grep -q "STAGE4_REGRESSION failures=\[\]" /tmp/stage4.log
          timeout 60s godot --headless --path "$GODOT_PROJECT_DIR" --fixed-fps 60 --script res://tests/cross_reactions.gd 2>&1 | tee /tmp/cross-reactions.log
          grep -q "CROSS_REACTIONS failures=\[\]" /tmp/cross-reactions.log

      - name: Verify Gou authored motion and contact frames
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/gou_motion_atlas.gd 2>&1 | tee /tmp/gou-motion.log
          grep -q "GOU_MOTION_ATLAS_OK.*failures=\[\]" /tmp/gou-motion.log

      - name: Verify character animation contract
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/dev052_visual_check.gd 2>&1 | tee /tmp/dev052-visual.log || true
          grep -q "DEV052_OK" /tmp/dev052-visual.log

      - name: Verify Seiya authored motion
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/seiya_motion_atlas.gd 2>&1 | tee /tmp/seiya-motion.log
          grep -q "SEIYA_MOTION_ATLAS_OK.*failures=\[\]" /tmp/seiya-motion.log

      - name: Verify Seiya source coordinates across display margins
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/seiya_source_basis_check.gd 2>&1 | tee /tmp/seiya-source-basis.log
          grep -Fq 'SEIYA_SOURCE_BASIS_CHECK frames=423 failures=[]' /tmp/seiya-source-basis.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/seiya-source-basis.log; then exit 1; fi
          timeout 180s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/hero_margin_physics_check.gd 2>&1 | tee /tmp/hero-margin-physics.log
          grep -Fq 'HERO_MARGIN_PHYSICS_CHECK frames=1648 failures=[]' /tmp/hero-margin-physics.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/hero-margin-physics.log; then exit 1; fi

      - name: Verify Stage 7 and 8 character motion and backdrops
        shell: bash
        run: |
          set -o pipefail
          timeout 90s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/stage7_8_motion_atlas.gd 2>&1 | tee /tmp/stage7-8-motion.log
          grep -q "STAGE7_8_MOTION_ATLAS_OK.*fixed_scale=true night_backdrops=true" /tmp/stage7-8-motion.log

      - name: Verify published main theme and audio transitions
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GODOT_PROJECT_DIR/audio/music/st_action_theme.ogg"
          timeout 180s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/theme_music_check.gd 2>&1 | tee /tmp/theme-music.log
          grep -F 'failures=[]' /tmp/theme-music.log
      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WEB_BUILD_DIR"
          godot --headless --path "$GODOT_PROJECT_DIR" --export-release "Web" "../$WEB_BUILD_DIR/index.html"
          touch "$WEB_BUILD_DIR/.nojekyll"
          cp "$GODOT_PROJECT_DIR/assets/fonts/OFL.txt" "$WEB_BUILD_DIR/OFL-NotoSansJP.txt"

      - name: Verify exported PCK motion scales
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s godot --headless --main-pack "$WEB_BUILD_DIR/index.pck" --script res://tests/motion_atlas_serialization_check.gd 2>&1 | tee /tmp/exported-motion-scales.log
          grep -F 'failures=[]' /tmp/exported-motion-scales.log
          timeout 180s godot --headless --main-pack "$WEB_BUILD_DIR/index.pck" --script res://tests/stage1_body_dimensions_check.gd 2>&1 | tee /tmp/exported-body-dimensions.log
          grep -F 'failures=[]' /tmp/exported-body-dimensions.log

      - name: Force PNG web app icons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          svg = Path(os.environ["GODOT_PROJECT_DIR"]) / "icon.svg"
          text = svg.read_text(encoding="utf-8")
          match = re.search(r'base64,([^"]+)', text)
          if not match:
              raise SystemExit("Embedded PNG was not found in icon.svg")
          encoded = match.group(1).strip()
          encoded += "=" * (-len(encoded) % 4)
          data = base64.b64decode(encoded)
          if not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("Decoded icon is not a PNG")
          out = Path(os.environ["WEB_BUILD_DIR"])
          (out / "index.apple-touch-icon.png").write_bytes(data)
          (out / "index.icon.png").write_bytes(data)
          print(f"Decoded web icon: {len(data)} bytes")
          PY

      - name: Version Web runtime files for mobile cache refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          output = Path(os.environ["WEB_BUILD_DIR"])
          version = os.environ["GITHUB_SHA"][:12]
          runtime = f"game-{version}"
          html_path = output / "index.html"
          html = html_path.read_text(encoding="utf-8")
          html = html.replace('<script src="index.js">', f'<script src="{runtime}.js?v={version}">')
          html = html.replace('"executable":"index"', f'"executable":"{runtime}"')
          for extension in ("wasm", "pck"):
              html = html.replace(f'"index.{extension}"', f'"{runtime}.{extension}"')
          for icon in ("index.icon.png", "index.apple-touch-icon.png"):
              html = html.replace(f'{icon}"', f'{icon}?v={version}"')
          html = html.replace("<meta charset=\"utf-8\">", "<meta charset=\"utf-8\"><meta http-equiv=\"Cache-Control\" content=\"no-cache, no-store, must-revalidate\"><meta http-equiv=\"Pragma\" content=\"no-cache\"><meta http-equiv=\"Expires\" content=\"0\">")
          html_path.write_text(html, encoding="utf-8")
          for extension in ("js", "wasm", "pck", "audio.worklet.js", "audio.position.worklet.js"):
              source = output / f"index.{extension}"
              target = output / f"{runtime}.{extension}"
              if not source.is_file():
                  raise SystemExit(f"Missing Web runtime file: {source.name}")
              source.rename(target)
          print(f"Versioned Web runtime: {runtime}")
          PY

      - name: Verify Web build
        shell: bash
        run: |
          set -euo pipefail
          test -f "$WEB_BUILD_DIR/index.html"
          find "$WEB_BUILD_DIR" -maxdepth 1 -type f -print
          find "$WEB_BUILD_DIR" -maxdepth 1 -type f -name "*.wasm" | grep -q .
          find "$WEB_BUILD_DIR" -maxdepth 1 -type f -name "*.pck" | grep -q .
          grep -q "game-${GITHUB_SHA:0:12}.js?v=${GITHUB_SHA:0:12}" "$WEB_BUILD_DIR/index.html"
          grep -q '"executable":"game-' "$WEB_BUILD_DIR/index.html"
          test -s "$WEB_BUILD_DIR/game-${GITHUB_SHA:0:12}.audio.worklet.js"
          test -s "$WEB_BUILD_DIR/game-${GITHUB_SHA:0:12}.audio.position.worklet.js"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Godot Web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "godot/**"
      - ".github/workflows/deploy-godot-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"
  GODOT_STATUS: "stable"
  GODOT_PROJECT_DIR: "godot"
  WEB_BUILD_DIR: "build/web"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required packages
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Download Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          GODOT_FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          TEMPLATE_FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          BASE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}"

          curl --fail --location --retry 3 --output godot.zip "${BASE_URL}/${GODOT_FILE}"
          curl --fail --location --retry 3 --output export_templates.tpz "${BASE_URL}/${TEMPLATE_FILE}"

          mkdir -p "$HOME/.local/bin"
          unzip -q godot.zip -d "$HOME/.local/bin"
          GODOT_BINARY="$HOME/.local/bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          chmod +x "$GODOT_BINARY"
          ln -sf "$GODOT_BINARY" "$HOME/.local/bin/godot"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p template_extract "$TEMPLATE_DIR"
          unzip -q export_templates.tpz -d template_extract
          cp -a template_extract/templates/. "$TEMPLATE_DIR/"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Godot installation
        run: godot --version

      - name: Import project resources
        run: godot --headless --path "$GODOT_PROJECT_DIR" --editor --quit

      - name: Verify audio runtime
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/dev_audio_smoke.gd 2>&1 | tee /tmp/dev-audio.log || true
          grep -q "DEV_AUDIO_OK" /tmp/dev-audio.log

      - name: Verify Stage 1 battle slice
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/dev053_stage1_smoke.gd 2>&1 | tee /tmp/dev053-stage1.log || true
          grep -q "DEV053_STAGE1_OK" /tmp/dev053-stage1.log

      - name: Verify enemy air attacks
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/dev056_enemy_air_attack_smoke.gd 2>&1 | tee /tmp/dev056-air.log || true
          grep -q "DEV056_ENEMY_AIR_ATTACK_OK" /tmp/dev056-air.log

      - name: Verify Stage 2 campaign and Rei motion
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/stage2_regression.gd 2>&1 | tee /tmp/stage2-regression.log || true
          grep -q "STAGE2_REGRESSION failures=\[\]" /tmp/stage2-regression.log

      - name: Verify character animation contract
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/dev052_visual_check.gd 2>&1 | tee /tmp/dev052-visual.log || true
          grep -q "DEV052_OK" /tmp/dev052-visual.log

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WEB_BUILD_DIR"
          godot --headless --path "$GODOT_PROJECT_DIR" --export-release "Web" "../$WEB_BUILD_DIR/index.html"
          touch "$WEB_BUILD_DIR/.nojekyll"

      - name: Force PNG web app icons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          svg = Path(os.environ["PROJECT_DIR"]) / "icon.svg"
          text = svg.read_text(encoding="utf-8")
          match = re.search(r'base64,([^"]+)', text)
          if not match:
              raise SystemExit("Embedded PNG was not found in icon.svg")
          data = base64.b64decode(match.group(1))
          if not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("Decoded icon is not a PNG")
          out = Path(os.environ["WEB_BUILD_DIR"])
          (out / "index.apple-touch-icon.png").write_bytes(data)
          (out / "index.icon.png").write_bytes(data)
          print(f"Decoded web icon: {len(data)} bytes")
          PY

      - name: Refresh Web icon cache key
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's|index.icon.png"|index.icon.png?v=20260926e"|g; s|index.apple-touch-icon.png"|index.apple-touch-icon.png?v=20260926e"|g' "$WEB_BUILD_DIR/index.html"

      - name: Verify Web build
        shell: bash
        run: |
          set -euo pipefail
          test -f "$WEB_BUILD_DIR/index.html"
          find "$WEB_BUILD_DIR" -maxdepth 1 -type f -print
          find "$WEB_BUILD_DIR" -maxdepth 1 -type f -name "*.wasm" | grep -q .
          find "$WEB_BUILD_DIR" -maxdepth 1 -type f -name "*.pck" | grep -q .

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
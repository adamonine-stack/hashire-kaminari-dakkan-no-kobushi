name: Verify Stage 5 Shadow Boxer

on:
  push:
    branches:
      - agent/stage5-shadow-boxer-20260930
    paths:
      - "godot/**"
      - ".github/workflows/verify-stage5-shadow.yml"

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7"
  GODOT_STATUS: "stable"
  GODOT_PROJECT_DIR: "godot"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required packages
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          GODOT_FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          BASE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}"
          curl --fail --location --retry 3 --output godot.zip "${BASE_URL}/${GODOT_FILE}"
          mkdir -p "$HOME/.local/bin"
          unzip -q godot.zip -d "$HOME/.local/bin"
          GODOT_BINARY="$HOME/.local/bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          chmod +x "$GODOT_BINARY"
          ln -sf "$GODOT_BINARY" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Godot
        run: godot --version

      - name: Import resources
        run: godot --headless --path "$GODOT_PROJECT_DIR" --editor --quit

      - name: Verify visual contract including Shadow Boxer
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/dev052_visual_check.gd 2>&1 | tee /tmp/dev052.log
          grep -q "DEV052_OK" /tmp/dev052.log

      - name: Verify enemy pressure profile including Shadow Boxer
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/dev061_enemy_pressure_smoke.gd 2>&1 | tee /tmp/dev061.log
          grep -q "DEV061_ENEMY_PRESSURE_OK" /tmp/dev061.log

      - name: Verify Stage 5 Shadow Boxer runtime
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path "$GODOT_PROJECT_DIR" --fixed-fps 60 --script res://tests/stage5_shadow_boxer_regression.gd 2>&1 | tee /tmp/stage5-shadow.log
          grep -q "STAGE5_SHADOW_BOXER_REGRESSION failures=\[\]" /tmp/stage5-shadow.log

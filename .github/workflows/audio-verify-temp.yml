name: Temporary Audio Branch Verify

on:
  push:
    branches:
      - agent/audio-pass-20260925-chat
    paths:
      - "godot/**"
      - ".github/workflows/audio-verify-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7"
  GODOT_STATUS: "stable"
  GODOT_PROJECT_DIR: "godot"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          curl --fail --location --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${TAG}/${FILE}"
          unzip -q godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          ln -s "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" /tmp/godot-bin/godot
          echo "/tmp/godot-bin" >> "$GITHUB_PATH"

      - name: Parse and import project
        run: godot --headless --path "$GODOT_PROJECT_DIR" --editor --quit

      - name: Stage 1 smoke
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/dev053_stage1_smoke.gd 2>&1 | tee /tmp/dev053.log || true
          grep -q "DEV053_STAGE1_OK" /tmp/dev053.log

      - name: Character visual contract
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path "$GODOT_PROJECT_DIR" --script res://tests/dev052_visual_check.gd 2>&1 | tee /tmp/dev052.log || true
          grep -q "DEV052_OK" /tmp/dev052.log

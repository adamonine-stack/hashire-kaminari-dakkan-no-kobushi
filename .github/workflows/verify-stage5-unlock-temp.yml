name: Verify Stage 5 Unlock Fix

on:
  push:
    branches:
      - agent/fix-stage5-unlock-20260930

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7"
  GODOT_STATUS: stable
  GODOT_PROJECT_DIR: godot

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required packages
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          GODOT_FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          BASE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}"
          curl --fail --location --retry 3 --output godot.zip "${BASE_URL}/${GODOT_FILE}"
          mkdir -p "$HOME/.local/bin"
          unzip -q godot.zip -d "$HOME/.local/bin"
          GODOT_BINARY="$HOME/.local/bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          chmod +x "$GODOT_BINARY"
          ln -sf "$GODOT_BINARY" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Import resources
        run: godot --headless --path "$GODOT_PROJECT_DIR" --editor --quit

      - name: Verify Stage 4 isolated regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path "$GODOT_PROJECT_DIR" --fixed-fps 60 --script res://tests/stage4_regression.gd 2>&1 | tee /tmp/stage4.log
          grep -q "STAGE4_REGRESSION failures=\[\]" /tmp/stage4.log

      - name: Verify Stage 5 unlock and Shadow Boxer
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path "$GODOT_PROJECT_DIR" --fixed-fps 60 --script res://tests/stage5_shadow_boxer_regression.gd 2>&1 | tee /tmp/stage5.log
          grep -q "STAGE5_SHADOW_BOXER_REGRESSION failures=\[\]" /tmp/stage5.log
